api_platform:
    title: Hello API Platform
    version: 1.0.0
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']

    mapping:
        paths: ['%kernel.project_dir%/src/Entity']
    # Assure-toi que 'circular_reference_handler' est bien configuré
    formats:
        json: ['application/json']
    swagger:
        api_keys:
            JWT:
                name: Authorization
                type: header
    
    
