
services:
  api:
    build:
      context: ../..
      dockerfile: docker/workshop/Dockerfile
    container_name: workshop-api
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: ${APP_SECRET}
      DEFAULT_URI: ${DEFAULT_URI}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
    volumes:
      - type: bind
        source: ../..
        target: /var/www/html
      - api_var:/var/www/html/var
      - api_vendor:/var/www/html/vendor
      - jwt_keys:/var/www/html/config/jwt
    networks:
      - frontend
      - backend
    depends_on:
      database:
        condition: service_healthy
    mem_limit: 2g
    cpus: 1.5

  gateway:
    image: nginx:1.28-alpine
    container_name: workshop-gateway
    restart: unless-stopped
    ports:
      - "192.168.3.128:8080:80"
    volumes:
      - type: bind
        source: ../..
        target: /var/www/html
        read_only: true
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
    depends_on:
      - api
    mem_limit: 256m
    cpus: 0.25

  database:
    image: postgres:16-alpine
    container_name: workshop-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - database_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 1g
    cpus: 1.0

networks:
  frontend:
    internal: true
  backend:
    internal: true

volumes:
  database_data:
  api_var:
  api_vendor:
  jwt_keys:
